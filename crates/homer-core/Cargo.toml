[package]
name = "homer-core"
version = "0.2.8"
edition = "2024"

[features]
default = []
desktop = ["dep:tauri"]
server = ["dep:tokio"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
hound = "=3.5.1"
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
