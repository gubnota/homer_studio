services:
  homer:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOMER_TOKEN: ${HOMER_TOKEN:?Set a private server token}
      HOMER_SECURE_COOKIE: ${HOMER_SECURE_COOKIE:-0}
    volumes:
      - homer-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  homer-data:
