name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apple-silicon-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install media tools
        run: brew install ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag
        run: node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME" --version-only
      - name: Run checks
        run: npm run build && cargo test --manifest-path src-tauri/Cargo.toml && npm run test:integration
      - name: Create and verify packages
        run: npm run package:mac && node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME" --package
      - name: Smoke test packaged app
        run: npm run test:smoke
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          src-tauri/target/release/bundle/dmg/*.dmg
          src-tauri/target/release/bundle/macos/*.zip
          --generate-notes
